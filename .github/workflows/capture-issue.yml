name: Capture Issue and Generate Post

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: read

jobs:
  capture-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ADMIN_PAT }}

      - name: Check if author is authorized
        id: check_author
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # List of authorized users (comma-separated)
          # By default, only the repository owner is authorized
          AUTHORIZED_USERS="${REPO_OWNER}"
          
          # You can add more users by setting a repository secret AUTHORIZED_USERS
          # Format: "user1,user2,user3"
          if [ -n "${{ secrets.AUTHORIZED_USERS }}" ]; then
            AUTHORIZED_USERS="${{ secrets.AUTHORIZED_USERS }}"
          fi
          
          echo "Issue author: ${ISSUE_AUTHOR}"
          echo "Authorized users: ${AUTHORIZED_USERS}"
          
          # Check if author is in the authorized list
          if echo "${AUTHORIZED_USERS}" | tr ',' '\n' | grep -qx "${ISSUE_AUTHOR}"; then
            echo "✓ Author is authorized for AI generation"
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Author is NOT authorized for AI generation"
            echo "⚠️  Issue will NOT be saved to the repository to save API tokens"
            echo "⚠️  Only issues from authorized users are committed"
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: Save issue to file
        if: steps.check_author.outputs.authorized == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          # Create issue directory
          mkdir -p issues
          
          # Save issue as markdown with status "pending"
          cat > "issues/issue-${ISSUE_NUMBER}.md" << 'ISSUE_EOF'
          ---
          issue_number: ${{ github.event.issue.number }}
          title: "${{ github.event.issue.title }}"
          author: ${{ github.event.issue.user.login }}
          created_at: ${{ github.event.issue.created_at }}
          status: pending
          ---

          # ${{ github.event.issue.title }}

          **Issue #${{ github.event.issue.number }}**
          **Author:** ${{ github.event.issue.user.login }}
          **Created:** ${{ github.event.issue.created_at }}

          ## Description

          ${{ github.event.issue.body }}
          ISSUE_EOF

      - name: Set up Python
        if: steps.check_author.outputs.authorized == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_author.outputs.authorized == 'true'
        run: |
          pip install openai pyyaml

      - name: Generate AI post
        if: steps.check_author.outputs.authorized == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          import glob
          from datetime import datetime

          # Check for OpenAI API key
          openai_key = os.environ.get('OPENAI_API_KEY')
          issue_number = os.environ.get('ISSUE_NUMBER')

          if not openai_key:
              print("Warning: OPENAI_API_KEY not set. Skipping AI generation.")
              exit(0)

          # Import OpenAI
          try:
              from openai import OpenAI
              client = OpenAI(api_key=openai_key)
          except ImportError:
              print("OpenAI library not available")
              exit(1)

          # Read the issue file
          issue_file = f'issues/issue-{issue_number}.md'
          
          try:
              with open(issue_file, 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              print(f"Issue file not found: {issue_file}")
              exit(1)

          # Extract image URLs from Issue body (GitHub issue attachments)
          # GitHub image attachments can be in two formats:
          # 1. Markdown: ![image](https://github.com/user-attachments/assets/xxx)
          #              ![description](https://user-images.githubusercontent.com/xxx.png)
          # 2. HTML: <img ... src="https://github.com/user-attachments/assets/xxx" ... />
          image_urls = []
          
          # Pattern 1: Markdown image syntax ![...](url)
          markdown_pattern = r'!\[.*?\]\((https://(?:github\.com/user-attachments/assets|user-images\.githubusercontent\.com)/[^\s\)]+)\)'
          image_urls.extend(re.findall(markdown_pattern, content))
          
          # Pattern 2: HTML img tag <img ... src="url" ... />
          html_pattern = r'<img[^>]+src=["\']?(https://(?:github\.com/user-attachments/assets|user-images\.githubusercontent\.com)/[^\s"\'>\)]+)["\']?'
          image_urls.extend(re.findall(html_pattern, content))
          
          # Remove duplicates while preserving order
          seen = set()
          unique_image_urls = []
          for url in image_urls:
              if url not in seen:
                  seen.add(url)
                  unique_image_urls.append(url)
          image_urls = unique_image_urls
          
          if image_urls:
              print(f"Found {len(image_urls)} image(s) in issue: {image_urls}")
          else:
              print("No images found in issue (posts will be text-only)")

          # Extract metadata using YAML parsing
          import yaml
          
          # Split frontmatter from content
          if content.startswith('---'):
              parts = content.split('---', 2)
              if len(parts) >= 3:
                  try:
                      frontmatter = yaml.safe_load(parts[1])
                      title = frontmatter.get('title', 'Untitled')
                  except yaml.YAMLError:
                      # Fallback to regex if YAML parsing fails
                      match = re.search(r'title:\s*"?(.*?)"?\s*$', content, re.MULTILINE)
                      title = match.group(1) if match else 'Untitled'
              else:
                  title = 'Untitled'
          else:
              title = 'Untitled'

          print(f"Generating AI post for issue #{issue_number}: {title}")

          # LinkedIn character limit and split marker constant
          LINKEDIN_CHAR_LIMIT = 3000
          SPLIT_MARKER = '---SPLIT---'

          # Collect the opening lines of the 3 most recent posts so the model
          # can avoid repeating the same hook formula / structure (template
          # repetition across posts is itself an AI tell)
          def post_date_key(path):
              m = re.search(r'-(\d{8})', path)
              return m.group(1) if m else '00000000'

          recent_hooks = []
          for p in sorted(glob.glob('posts/post-*.md'), key=post_date_key)[-3:]:
              with open(p, 'r') as f:
                  c = f.read()
              body = c.split('---', 2)[2] if c.startswith('---') else c
              lines = [l for l in body.strip().splitlines() if l.strip()]
              if lines:
                  recent_hooks.append(f"《{os.path.basename(p)}》開頭：\n" + "\n".join(lines[:2]))

          recent_hooks_text = "\n\n".join(recent_hooks) if recent_hooks else "（目前沒有歷史貼文，不受輪替限制）"

          # Load LinkedIn post skill (.claude/skills/linkedin-post/)
          # The skill is the source of truth for how to write LinkedIn posts.
          # If skill files are missing, fall back to stop-slop-only behaviour.
          skill_dir = '.claude/skills/linkedin-post'
          skill_main = ''
          hook_formulas = ''
          linkedin_playbook = ''
          try:
              with open(f'{skill_dir}/SKILL.md', 'r') as f:
                  skill_main = f.read()
              with open(f'{skill_dir}/references/hook_formulas.md', 'r') as f:
                  hook_formulas = f.read()
              with open(f'{skill_dir}/references/linkedin_playbook.md', 'r') as f:
                  linkedin_playbook = f.read()
              print(f"Loaded linkedin-post skill from {skill_dir}")
          except FileNotFoundError as e:
              print(f"Warning: linkedin-post skill file missing ({e}); proceeding without skill guidance")

          # Stop-slop writing guidelines (from https://github.com/hardikpandya/stop-slop)
          # Eliminates predictable AI writing patterns from prose
          with open('config/stop-slop-guidelines.md', 'r') as f:
              stop_slop_guidelines = f.read()

          prompt = f"""你正在執行本專案 `.claude/skills/linkedin-post` skill 的 **G1 階段（把 issue 變 LinkedIn 貼文）**。請完整遵守下列 skill 內容、Hook 公式庫、Playbook 與反 AI 味規則。

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 📘 Skill 主檔（SKILL.md）
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {skill_main}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 🎯 Hook 公式庫（references/hook_formulas.md）
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {hook_formulas}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 📐 LinkedIn Playbook（references/linkedin_playbook.md）
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {linkedin_playbook}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## ✂️ 反 AI 味通用規則（config/stop-slop-guidelines.md）
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {stop_slop_guidelines}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 📝 來源 Issue 內容
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {content}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 🔁 最近 3 篇貼文的開頭（hook / 結構輪替用）
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {recent_hooks_text}

          新貼文的 hook 公式與收尾方式必須跟上面這些錯開（hook_formulas.md「輪替規則」+ linkedin_playbook.md「結構變化」）。

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ## 🎬 你的任務
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          按 SKILL.md 「📋 生成流程（G1）」的 7 個步驟產生一篇 LinkedIn 技術貼文：

          1. 從 issue 抓 1 個最有張力的 angle（不是把整個 issue 翻寫）
          2. 對照 hook_formulas.md 的「Hook 選擇對照表」挑 1 個公式（H1-H8），按 issue 性質配對
          3. 依 linkedin_playbook.md「排版規則」寫 4-6 段繁中正文，每段 1-3 句
          4. 結尾依「留言誘因設計」寫一個開放式問題
          5. 放 3-5 個 hashtag（最末段同一行）
          6. 最後一行加上「🤖 本文為 AI 產生的貼文」
          7. 跑完 SKILL.md「✅ Self-check 清單」全項才輸出

          **輸出硬規則**：
          - 全文繁體中文，專有名詞用英文
          - 受眾是台灣的工程師與科技公司：用語、舉例一律以台灣為準，禁止中國用語（見 stop-slop「台灣用語規範」）
          - 絕不編造 issue 裡沒有的數字、經驗、人名、場景（SKILL.md 硬規則 7；issue 沒寫的就不要寫）
          - 字數 700-1300 繁中（單篇 sweet spot）
          - 若內容必須拆 → 用「{SPLIT_MARKER}」分隔，每篇開頭標「(第 X 篇/共 Y 篇)」，每篇 < {LINKEDIN_CHAR_LIMIT} 字元
          - **不要輸出 YAML frontmatter**（status / published_url 等由 workflow 處理）
          - **不要輸出任何說明、解釋、自我評論**，只輸出貼文本體
          - **不在正文嵌入外部連結**（依 SKILL.md 硬規則 5，連結請放文末「來源見留言」字樣或省略）
          """

          try:
              response = client.chat.completions.create(
                  model="gpt-4o",
                  messages=[
                      {"role": "system", "content": "你是 tech-post 專案的 LinkedIn 貼文生成器，執行 .claude/skills/linkedin-post skill 的 G1 階段。受眾是台灣的工程師與科技公司，一律繁體中文與台灣慣用語（專有名詞英文，禁止中國用語）。嚴格遵守 user message 內附的 SKILL.md、hook_formulas.md、linkedin_playbook.md、stop-slop-guidelines.md 全部規則。絕不編造 issue 裡沒有的數字或經驗。只輸出貼文本體，不輸出 frontmatter、不輸出解釋、不自我引用、不加開場白。"},
                      {"role": "user", "content": prompt}
                  ],
                  max_tokens=4000,
                  temperature=0.7
              )
              
              tech_post = response.choices[0].message.content
              
              # Split posts if they contain the split marker
              posts = tech_post.split(SPLIT_MARKER)
              posts = [p.strip() for p in posts if p.strip()]
              
              # Validate that each post part is within the LinkedIn character limit
              # If any part exceeds the limit, log a warning (AI didn't honor the limit perfectly)
              for i, post_content in enumerate(posts, 1):
                  if len(post_content) > LINKEDIN_CHAR_LIMIT:
                      print(f"Warning: Post part {i} exceeds LinkedIn limit ({len(post_content)} chars > {LINKEDIN_CHAR_LIMIT})")
              
              os.makedirs('posts', exist_ok=True)
              
              # If there are multiple posts, save each one separately
              if len(posts) > 1:
                  for i, post_content in enumerate(posts, 1):
                      post_filename = f"posts/post-{issue_number}-{datetime.now().strftime('%Y%m%d')}-part{i}.md"
                      
                      # Prepare frontmatter using YAML for proper escaping
                      frontmatter_data = {
                          'issue_number': int(issue_number),
                          'original_title': title,
                          'generated_at': datetime.now().isoformat(),
                          'status': 'generated',
                          'part': i,
                          'total_parts': len(posts)
                      }
                      # Add image URLs to frontmatter (only for first part to avoid duplicates)
                      if i == 1 and image_urls:
                          frontmatter_data['image_urls'] = image_urls
                      
                      with open(post_filename, 'w') as f:
                          f.write("---\n")
                          f.write(yaml.dump(frontmatter_data, default_flow_style=False, allow_unicode=True))
                          f.write("---\n\n")
                          f.write(post_content)
                      
                      print(f"Generated post part {i}/{len(posts)}: {post_filename}")
              else:
                  # Single post case
                  post_filename = f"posts/post-{issue_number}-{datetime.now().strftime('%Y%m%d')}.md"
                  
                  # Prepare frontmatter using YAML for proper escaping
                  frontmatter_data = {
                      'issue_number': int(issue_number),
                      'original_title': title,
                      'generated_at': datetime.now().isoformat(),
                      'status': 'generated'
                  }
                  # Add image URLs to frontmatter if found
                  if image_urls:
                      frontmatter_data['image_urls'] = image_urls
                  
                  with open(post_filename, 'w') as f:
                      f.write("---\n")
                      f.write(yaml.dump(frontmatter_data, default_flow_style=False, allow_unicode=True))
                      f.write("---\n\n")
                      f.write(tech_post)
              
                  print(f"Generated post: {post_filename}")
              
              # Update issue status - use regex to only replace in frontmatter
              updated_content = re.sub(
                  r'^status:\s*pending\s*$',
                  'status: generated',
                  content,
                  count=1,
                  flags=re.MULTILINE
              )
              with open(issue_file, 'w') as f:
                  f.write(updated_content)
              
              print("Issue status updated to 'generated'")
              
          except Exception as e:
              print(f"Error generating post: {e}")
              exit(1)
          PYTHON_SCRIPT

      - name: Commit and push changes
        if: steps.check_author.outputs.authorized == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issues/ posts/
          git commit -m "Add issue #${ISSUE_NUMBER} and AI-generated post: ${ISSUE_TITLE}" || echo "No changes to commit"
          
          # Push to main branch explicitly
          git push origin main
